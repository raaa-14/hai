<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stand By Me 🤍</title>

<style>
:root {
    --gold: #ffd369;
    --dark: #0b0e16;
    --soft: rgba(255,255,255,0.08);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(180deg, #0b0e16, #000);
    color: #fff;
}

/* 🌌 background glow */
.bg-glow {
    position: fixed;
    width: 320px;
    height: 320px;
    background: radial-gradient(circle, rgba(255,215,150,0.25), transparent);
    animation: float 10s infinite alternate ease-in-out;
    z-index: -1;
}
.bg-glow.one { top: 10%; left: 10%; }
.bg-glow.two { bottom: 10%; right: 10%; animation-duration: 14s; }

@keyframes float {
    from { transform: translateY(-30px); }
    to { transform: translateY(30px); }
}

/* 📐 layout */
section {
    padding: 70px 20px;
    max-width: 680px;
    margin: auto;
}

.hero {
    text-align: center;
    padding-top: 90px;
}

.hero h1 {
    font-size: 34px;
    color: var(--gold);
    margin-bottom: 10px;
}

.hero p {
    font-size: 16px;
    opacity: 0.85;
}

/* 💌 card sections */
.card {
    background: var(--soft);
    backdrop-filter: blur(12px);
    border-radius: 22px;
    padding: 28px;
    margin-top: 30px;
    box-shadow: 0 0 40px rgba(255,215,150,0.12);
}

/* ✨ lyrics */
#lyrics {
    font-size: 16px;
    line-height: 1.8;
    opacity: 0;
    transition: opacity 1.6s ease;
    text-align: center;
}

/* 🎶 quote */
.quote {
    text-align: center;
    margin-top: 24px;
    font-style: italic;
    color: var(--gold);
    opacity: 0.9;
}

/* 💕 buttons */
.actions {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 26px;
}

.btn {
    padding: 14px 28px;
    border-radius: 30px;
    font-size: 14px;
    cursor: pointer;
    transition: 0.3s;
    border: none;
}

.btn-love {
    background: var(--gold);
    color: #000;
}

.btn-sad {
    background: transparent;
    color: #fff;
    border: 1px solid #aaa;
}

.btn:hover {
    transform: scale(1.07);
}

/* footer */
footer {
    text-align: center;
    padding: 40px 20px 60px;
    font-size: 13px;
    opacity: 0.6;
}
</style>
</head>

<body>

<div class="bg-glow one"></div>
<div class="bg-glow two"></div>

<!-- 🎶 AUDIO -->
<audio id="oasis" preload="auto">
    <source src="standbyme.mp3" type="audio/mpeg">
</audio>

<!-- 🌙 HERO -->
<section class="hero">
    <h1>Hai <span id="nama"></span> 🤍</h1>
    <p>Ada sesuatu yang ingin aku sampaikan…</p>
</section>

<!-- 💌 MESSAGE -->
<section class="card">
    <p style="text-align:center; line-height:1.8;">
        Aku minta maaf kalau kata-kataku kemarin jadi luka.<br>
        Bukan karena aku nggak peduli,<br>
        tapi karena aku masih belajar menjaga hati orang yang aku sayang.
    </p>
</section>

<!-- 🎶 LYRICS -->
<section class="card">
    <div id="lyrics"></div>

    <div class="quote">
        “Stand by me, nobody knows the way it’s gonna be…”
    </div>

    <div class="actions">
        <button class="btn btn-love" onclick="maafin()">💕 Maafin</button>
        <button class="btn btn-sad" onclick="tidakMaafin()">💔 Tidak Maafin</button>
    </div>
</section>

<footer>
    Made with sincerity 🤍
</footer>

<script>
/* 💌 Nama */
document.getElementById("nama").innerText = "Opikkkk";

/* 🎶 Musik */
const music = document.getElementById("oasis");
music.volume = 0;
let started = false;

/* 🔊 Fade In */
function fadeInMusic() {
    if (started) return;
    started = true;
    music.play();
    let vol = 0;
    const fade = setInterval(() => {
        if (vol < 0.7) {
            vol += 0.02;
            music.volume = vol;
        } else {
            clearInterval(fade);
        }
    }, 300);
}

/* 🔉 Fade Out */
let fading = false;
function fadeOutMusic() {
    if (fading) return;
    fading = true;
    let vol = music.volume;
    const fade = setInterval(() => {
        if (vol > 0.02) {
            vol -= 0.02;
            music.volume = vol;
        } else {
            clearInterval(fade);
            music.pause();
        }
    }, 300);
}

music.addEventListener("timeupdate", () => {
    if (music.duration && music.currentTime >= music.duration - 20) {
        fadeOutMusic();
    }
});

/* ▶️ Tap untuk mulai */
document.addEventListener("click", fadeInMusic, { once: true });

/* ✨ Lirik sinkron */
const lyricsBox = document.getElementById("lyrics");
const lines = [
    { time: 3, text: "I know I made mistakes." },
    { time: 10, text: "Some words stayed longer than they should." },
    { time: 18, text: "And I’m truly sorry." },
    { time: 26, text: "When everything feels heavy," },
    { time: 34, text: "I just want to be the one who stays." },
    { time: 44, text: "Not the reason you’re hurting." },
    { time: 56, text: "Aku nggak sempurna," },
    { time: 64, text: "tapi perasaanku tulus." },
    { time: 74, text: "Stand by me 🤍" }
];

let i = 0;
function showLyrics() {
    if (i < lines.length) {
        setTimeout(() => {
            lyricsBox.style.opacity = 0;
            setTimeout(() => {
                lyricsBox.innerText = lines[i].text;
                lyricsBox.style.opacity = 1;
                i++;
                showLyrics();
            }, 1200);
        }, (i === 0 ? lines[0].time : lines[i].time - lines[i-1].time) * 1000);
    }
}
window.onload = showLyrics;

/* 💕 WhatsApp */
function maafin() {
    window.location.href =
    "https://api.whatsapp.com/send?phone=6287822132387&text=Aku%20maafin%20kamu%20%F0%9F%A4%8D%F0%9F%92%96";
}

function tidakMaafin() {
    alert("Aku sedih… tapi aku tetap di sini 🤍");
}
</script>

</body>
</html>
